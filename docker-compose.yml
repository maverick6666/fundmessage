services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: fundmessage-db
    environment:
      POSTGRES_USER: ${DB_USER:-funduser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fundpass123}
      POSTGRES_DB: ${DB_NAME:-fundmessenger}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-funduser} -d ${DB_NAME:-fundmessenger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot 백엔드
  backend:
    build:
      context: ./spring-backend/backend
      dockerfile: Dockerfile
    container_name: fundmessage-backend
    env_file:
      - ./spring-backend/backend/.env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-fundmessenger}
      DB_USERNAME: ${DB_USER:-funduser}
      DB_PASSWORD: ${DB_PASSWORD:-fundpass123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # React 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    container_name: fundmessage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
